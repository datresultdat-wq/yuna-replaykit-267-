name: YUNA ScreenCaptureKit 27 compile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Expand ScreenCaptureKit BuildKit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildkit
          mkdir buildkit
          unzip -q YUNA-ScreenCaptureKit-270-PUBLIC-COMPILE-002.zip -d buildkit
          test -f buildkit/app/YunaCapture.xcodeproj/project.pbxproj
          test -f buildkit/ci/build.sh

      - name: Compile iPadOS 27 ScreenCaptureKit host
        shell: bash
        run: |
          set -uo pipefail
          cd buildkit
          mkdir -p build
          xcodebuild -version | tee build/environment.txt
          xcodebuild -showsdks | tee -a build/environment.txt
          bash ci/build.sh 2>&1 | tee build/compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            python3 ci/verify_bundle.py \
              build/DerivedData/Build/Products/Release-iphoneos/YunaCapture.app \
              | tee build/bundle-report.json
          fi
          exit "$status"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuna-screencapturekit-270-diagnostics
          path: |
            buildkit/build/environment.txt
            buildkit/build/compile.log
            buildkit/build/bundle-report.json
          retention-days: 1
          if-no-files-found: warn
